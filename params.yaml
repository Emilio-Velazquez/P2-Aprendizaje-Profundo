data:
  raw_path: data/raw/beijing_pm25.csv
  processed_dir: data/processed
preprocess:
  window: 24
  horizon: 1
  train_frac: 0.70
  val_frac: 0.15
  target: pm2.5
  max_interp_gap: 6
model:
  name: lstm
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
train:
  epochs: 50
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  patience: 8
  scheduler_patience: 3
  scheduler_factor: 0.5
  grad_clip: 1.0
  seed: 42
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: pm25-forecasting

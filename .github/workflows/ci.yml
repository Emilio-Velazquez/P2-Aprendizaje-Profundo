name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install PyTorch CPU and dependencies
        run: |
          pip install --no-cache-dir torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt

      - name: Download dataset
        run: python -m src.data.download

      - name: Preprocess data
        run: python src/data/preprocess.py

      - name: Code formatting and lint checks
        run: SKIP=pytest pre-commit run --all-files

      - name: Run unit and parity tests
        run: python -m pytest -v
